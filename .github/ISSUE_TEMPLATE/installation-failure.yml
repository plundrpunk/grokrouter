name: Installation problem
description: Report a GrokRouter setup or repair failure without sharing secrets.
title: "[Install]: "
labels:
  - installation
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Never paste an OpenRouter key, Codex device code, password, conversation, or private Bot file.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: The beginner-tested path is Apple-silicon macOS. Windows remains a source preview.
      options:
        - Apple-silicon Mac
        - Windows x64 preview
        - Windows Arm64 preview
        - Unsupported or unknown
    validations:
      required: true

  - type: input
    id: grokrouter_version
    attributes:
      label: GrokRouter version
      placeholder: 0.1.0-beta.44
    validations:
      required: true

  - type: dropdown
    id: install_source
    attributes:
      label: Installation source
      description: Old forks and downloaded copies can contain an earlier router even when this README is current.
      options:
        - Pinned beta.44 Terminal command from the official README
        - ZIP downloaded from the official repository
        - Fork, clone, old ZIP, or another source
        - I do not know
    validations:
      required: true

  - type: dropdown
    id: literal_provider_result
    attributes:
      label: Result after manually typing /provider
      description: Type the complete /provider command in a genuinely new Bot. Do not rely on the slash-suggestion menu.
      options:
        - It named Codex SDK or OpenRouter and a model
        - It produced an ordinary AI answer
        - It was ignored or produced no answer
        - I could not complete this check
    validations:
      required: true

  - type: textarea
    id: safe_diagnostics
    attributes:
      label: Safe diagnostics
      description: In GrokRouter, click Copy safe diagnostics and paste the report here.
      render: text
    validations:
      required: true

  - type: textarea
    id: visible_result
    attributes:
      label: What happened?
      description: Describe the last visible step and what you expected to happen.
      placeholder: It stopped while downloading dependencies after I opened the Bot computer.
    validations:
      required: true

  - type: checkboxes
    id: secret_check
    attributes:
      label: Privacy check
      options:
        - label: I confirmed this report contains no API key, device code, password, conversation, or private Bot file.
          required: true
