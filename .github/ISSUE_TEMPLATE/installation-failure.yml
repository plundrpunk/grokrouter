name: Installation problem
description: Report a GrokRouter setup or repair failure without sharing secrets.
title: "[Install]: "
labels:
  - installation
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Never paste an OpenRouter key, Codex device code, password, conversation, private Bot file, or Grok host source. GrokRouter's safe report contains the complete non-secret fingerprint we need.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Choose the physical computer running the Grok Bot desktop app. The Bot computer may separately report x86_64; that is normal cloud architecture, not Windows on your Mac.
      options:
        - Apple-silicon Mac
        - Windows x64 preview
        - Windows Arm64 preview
        - Unsupported or unknown
    validations:
      required: true

  - type: input
    id: grokrouter_version
    attributes:
      label: GrokRouter version
      description: Enter the Installer line from Copy safe diagnostics, such as 0.1.0-beta.45. Do not enter Grok Bot 0.30.0 here.
      placeholder: 0.1.0-beta.45
    validations:
      required: true

  - type: dropdown
    id: install_source
    attributes:
      label: Installation source
      description: Old forks and downloaded copies can contain an earlier router even when this README is current.
      options:
        - Pinned beta.45 Terminal command from the official README
        - ZIP downloaded from the official repository
        - Fork, clone, old ZIP, or another source
        - I do not know
    validations:
      required: true

  - type: dropdown
    id: literal_provider_result
    attributes:
      label: Result after manually typing /provider
      description: Complete this only after installation says it finished. Type the full command in a genuinely new Bot; do not rely on the slash-suggestion menu.
      options:
        - It named Codex SDK or OpenRouter and a model
        - It produced an ordinary AI answer
        - It was ignored or produced no answer
        - Installation did not finish, so I did not test this
    validations:
      required: true

  - type: dropdown
    id: host_adapter_result
    attributes:
      label: Host adapter result
      description: Use the Mac GrokRouter app's Run Doctor result. Do not ask Grok Bot to install or repair itself.
      options:
        - Patched and verified
        - stock-or-unknown or no router marker
        - Unsupported or changed host
        - Installation stopped before I could run Doctor
    validations:
      required: true

  - type: textarea
    id: safe_diagnostics
    attributes:
      label: Safe diagnostics
      description: In the Mac GrokRouter app, click Copy safe diagnostics and paste the entire report once. Beta.45 includes HOSTSHA1, HOSTSHA2, HOSTBYTES, CLOUDARCH, ANCHORS, and PATCHDRYRUN for a new stock variant without exposing source.
      render: text
    validations:
      required: true

  - type: textarea
    id: visible_result
    attributes:
      label: What happened?
      description: Describe the last visible step and what you expected to happen.
      placeholder: It stopped while downloading dependencies after I opened the Bot computer.
    validations:
      required: true

  - type: checkboxes
    id: secret_check
    attributes:
      label: Privacy check
      options:
        - label: I confirmed this report contains no API key, device code, password, conversation, or private Bot file.
          required: true
        - label: I did not bypass the version, hash, byte-count, signature, or anchor checks and did not paste Grok host source.
          required: true
