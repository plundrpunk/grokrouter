name: PR Governance

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]

permissions:
  contents: read

jobs:
  classify:
    name: pr-risk-classifier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      risk: ${{ steps.classify.outputs.risk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Compute and apply authoritative risk label
        id: classify
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const pull = context.payload.pull_request;
            const { pathToFileURL } = await import("node:url");
            const policy = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/pr_policy/policy.mjs`)
            );
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull.number,
              per_page: 100,
            });

            const { risk, reasons, totals } = policy.classifyRisk(files);
            const currentLabels = pull.labels.map((label) => label.name);
            const nextLabels = policy.labelsAfterClassification(
              currentLabels,
              risk,
              context.payload.action,
            );

            const unchanged =
              nextLabels.length === currentLabels.length &&
              nextLabels.every((label) => currentLabels.includes(label));
            if (!unchanged) {
              await github.rest.issues.setLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pull.number,
                labels: nextLabels,
              });
            }

            core.setOutput("risk", risk);
            core.notice(`Computed ${risk}: ${reasons.join("; ")}`);
            await core.summary
              .addHeading("PR risk classification")
              .addList([
                `Risk: ${risk}`,
                `Changed files: ${files.length}`,
                `Changed lines: ${totals.lines} (+${totals.additions}/-${totals.deletions})`,
                ...reasons.map((reason) => `Reason: ${reason}`),
              ])
              .write();

  gate:
    name: pr-merge-gate
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Enforce risk and human-approval policy
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          COMPUTED_RISK: ${{ needs.classify.outputs.risk }}
        with:
          script: |
            const { pathToFileURL } = await import("node:url");
            const policy = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/pr_policy/policy.mjs`)
            );
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const labels = pull.labels.map((label) => label.name);
            const requiredApproval = policy.requiredApprovalForRisk(process.env.COMPUTED_RISK);
            let approvalActor = null;
            if (requiredApproval && labels.includes(requiredApproval)) {
              const events = await github.paginate(github.rest.issues.listEvents, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pull.number,
                per_page: 100,
              });
              const approvalEvent = events
                .filter((event) => event.event === "labeled" && event.label?.name === requiredApproval)
                .at(-1);
              approvalActor = approvalEvent?.actor ?? null;
            }
            const { errors, risk } = policy.evaluateGate({
              draft: pull.draft,
              labels,
              computedRisk: process.env.COMPUTED_RISK,
              approvalActor,
            });

            await core.summary
              .addHeading("PR merge gate")
              .addList([
                `Risk: ${risk || "missing or ambiguous"}`,
                `Required approval: ${requiredApproval || "none"}`,
                `Result: ${errors.length === 0 ? "passed" : "blocked"}`,
                ...errors.map((error) => `Blocker: ${error}`),
              ])
              .write();

            if (errors.length > 0) core.setFailed(errors.join(" "));
