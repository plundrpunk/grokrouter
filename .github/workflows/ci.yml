name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Install pinned runtime dependencies
        run: npm ci --prefix runtime --ignore-scripts --no-audit --no-fund
      - name: Test all layers
        run: npm test
      - name: Build ad-hoc beta installer
        run: npm run build:macos
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grokrouter-macos
          path: |
            build/grokrouter-*-macos.zip
            build/grokrouter-*-macos.zip.sha256
          if-no-files-found: error
