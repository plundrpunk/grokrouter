name: Signed private release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Install pinned runtime dependencies
        run: npm ci --prefix runtime --ignore-scripts --no-audit --no-fund
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_BUILD_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/grokbot-router.keychain-db"
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
      - name: Configure Apple notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
        run: >-
          xcrun notarytool store-credentials grokbot-router-notary
          --apple-id "$APPLE_ID"
          --team-id "$APPLE_TEAM_ID"
          --password "$APPLE_APP_PASSWORD"
      - name: Test and build signed, notarized app
        env:
          ROUTER_CODESIGN_IDENTITY: Developer ID Application
          ROUTER_NOTARY_PROFILE: grokbot-router-notary
        run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: |
            build/grokrouter-*-macos.zip
            build/grokrouter-*-macos.zip.sha256
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            runtime/package-lock.json
            installer-windows/package-lock.json
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - name: Require Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
        run: |
          if (-not $env:WINDOWS_CODESIGN_PFX_BASE64) { throw "Configure WINDOWS_CODESIGN_PFX_BASE64 before publishing Windows builds." }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\grokrouter-codesign.pfx", [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
      - name: Install pinned runtime dependencies
        shell: bash
        run: npm ci --prefix runtime --ignore-scripts --no-audit --no-fund
      - name: Test Windows-portable layers
        shell: bash
        run: npm run test:runtime && npm run test:windows
      - name: Build and sign x64 and Arm64 Windows packages
        shell: bash
        env:
          ROUTER_WINDOWS_SIGN_PFX: ${{ runner.temp }}\grokrouter-codesign.pfx
          ROUTER_WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          npm run build:windows -- x64
          npm run build:windows -- arm64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: |
            build/grokrouter-*-windows-x64.zip
            build/grokrouter-*-windows-x64.zip.sha256
            build/grokrouter-*-windows-arm64.zip
            build/grokrouter-*-windows-arm64.zip.sha256
          if-no-files-found: error

  release:
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create private GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          gh release create "v$VERSION" \
            release-assets/*.zip \
            release-assets/*.zip.sha256 \
            --title "GrokRouter v$VERSION" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
